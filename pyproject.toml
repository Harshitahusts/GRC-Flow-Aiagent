[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grc-flow"
version = "0.1.0"
description = "Backend AI compliance pipeline (DPDPA) for GRC-Ai: RAG, Claude fact extraction, deterministic rules, checker agent."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # The GRC-Ai app (MIT, same team): corpus ingester, BM25 search, citation index, DB layer.
    "grc-agent @ git+https://github.com/Harshitahusts/GRC-Ai@fd5615f",
    # DPDP Act Sections 5-16 as deterministic checks (MIT).
    "dpdp-law-to-code @ git+https://github.com/Wolfgangrush/dpdp-law-to-code@8d79dc6",
    "anthropic>=1.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pinecone>=10",
    "upstash-redis>=1.8",
    "sentry-sdk[fastapi]>=2.30",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Supabase / PostgreSQL driver (used through grc_agent.web.db).
postgres = ["psycopg[binary]>=3.2"]
ml = ["scikit-learn>=1.4", "pyarrow>=15"]

[project.scripts]
grc-flow = "grc_flow.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["grc_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
