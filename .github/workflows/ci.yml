name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (SQLite, offline stand-ins)
        run: pytest -q
      - name: Offline end-to-end demo
        run: grc-flow demo

  # Same suite against PostgreSQL, the engine behind Supabase.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: grc
          POSTGRES_DB: grc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grc" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GRC_FLOW_TEST_DATABASE_URL: postgresql://grc:grc@localhost:5432/grc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Tests on PostgreSQL
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t grc-flow:ci .
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
